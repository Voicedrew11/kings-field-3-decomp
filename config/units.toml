# Explicit reconstruction build units. A profile is proven only for the units
# it has rebuilt byte-identically; elsewhere it remains a probe.

# Sony's GNU C 2.60 CC1PSX.EXE (DOSBox-X) with ASPSX 2.21, both from the
# 1995 Psy-Q/Runtime Library 3.3 era. -G8 is the compiler's own default: it
# rebuilds PSX.EXE's main exactly (proven for that unit) and keeps small
# globals $gp-relative, as 95 GAME, 20 OPEN and 5 END game functions do.
[profiles.gcc260-o2-g8]
language = "c"
compiler = "gcc260-sony"
optimization = "O2"
small_data = 8
aspsx_version = "2.21"
cc1_flags = []

# The same compiler for TUs whose globals are all reached by lui/low pairs.
# A probe until a GAME/OPEN/END unit matches with it.
[profiles.gcc260-o2-g0]
language = "c"
compiler = "gcc260-sony"
optimization = "O2"
small_data = 0
aspsx_version = "2.21"
cc1_flags = []

[profiles.asm-r3000-g0]
language = "assembly"
compiler = "aspsx"
small_data = 0
aspsx_version = "2.21"
cc1_flags = []

# Add one [[unit]] per reconstructed source, in linked (ascending address) order per image.

[[unit]]
unit = "psx.main"
image = "PSX.EXE"
source = "src/psx/main.c"
profile = "gcc260-o2-g8"

[[unit]]
unit = "end.main"
image = "END.EXE"
source = "src/end/main.c"
profile = "gcc260-o2-g8"

[[unit]]
unit = "end.movie"
image = "END.EXE"
source = "src/end/movie.c"
profile = "gcc260-o2-g8"
