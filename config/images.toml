# MANUALLY MANAGED - the retail disc and the linked images it carries.
#
# `name` is the tool's image identity (`--image` takes its lowercase stem,
# e.g. `game` or `fdat_002`). Root programs are PS-X EXEs read from the root
# ISO9660 file `disc_file`; `kf init` checks their header fields, so a wrong
# dump fails before any query. Overlays are headerless code images read from
# an archive entry (see the end of this file). Programs are listed first,
# then the overlays by archive entry; reports and inventories sort them in
# this order.
#
# Who loads what. PSX.EXE is a program sequencer: its table at 0x8001024C
# names, by index, 0 OPEN.EXE, 1 GAME.EXE, 2 END.EXE. It clears the index
# byte at 0x800102F0 (the pointer in its gp+4 word), then loops: BIOS
# Load(table[index]), Exec, and on return reads the next index from that
# byte. Which program stores which successor is not yet traced. GAME.EXE
# alone names `COM\FDAT.T` and loads the FDAT area modules.
#
# `gp` is the $gp value each program's startup loads (lui/addiu gp before the
# jump to main); gp-relative relocations decode against it. Overlays use
# their host's.

[disc]
serial = "SLUS-00255"
# Sold in North America as "King's Field II"; the Japanese King's Field III
# (SLPS-00377) is its original.
title = "King's Field III (USA)"
# Single-track MODE2/2352 image.
sha256 = "3ca3c3e03e16abd2a224eb430d6e848d3dc685d8adb4988353bb120b73635518"

# Boot loader named by SYSTEM.CNF (`BOOT = cdrom:\SLUS_002.55;1`).
[[image]]
name = "PSX.EXE"
disc_file = "SLUS_002.55"
sha256 = "c8e696c312c6ba0ad9c24b0977a993b517cddf649e3a20586a4f394b1224ae70"
file_size = 0x1000
entry = 0x80010120
gp = 0x80010260
load_address = 0x80010000
load_size = 0x800

# GAME, OPEN and END share one overlay load window at 0x80011000.
[[image]]
name = "GAME.EXE"
disc_file = "GAME.EXE"
sha256 = "7556ec7fa3324f39df483f5383bb8f6fcef5ba3b88a6dd4e895e366edf6b83d9"
file_size = 0x8C000
entry = 0x800144F8
gp = 0x8009C214
load_address = 0x80011000
load_size = 0x8B800

[[image]]
name = "OPEN.EXE"
disc_file = "OPEN.EXE"
sha256 = "bf5b2c820007157c2bf3bd380b0e5b280843f579c2e7fbc84605c22c5eb13edb"
file_size = 0x30000
entry = 0x800136C8
gp = 0x800403F4
load_address = 0x80011000
load_size = 0x2F800

[[image]]
name = "END.EXE"
disc_file = "END.EXE"
sha256 = "57feb4f5cb2031469516a88d485334cc3ba6162a8f47ce73ab934164a7b7f999"
file_size = 0x27000
entry = 0x80011D04
gp = 0x80037498
load_address = 0x80011000
load_size = 0x26800

# Code overlays inside CD\COM\FDAT.T. The archive is a u16 entry count (132)
# followed by u16 sector (0x800-byte) offsets; entry i spans sectors
# offset[i]..offset[i+1]. Entries 0..83 are 28 triplets of two data entries
# and one code module, so the code is entry 3n+2 (2, 5, ..., 83); entries
# 84..131 hold no code. GAME.EXE alone names `COM\FDAT.T` (its archive-name
# table at 0x80011000) and holds the common load address 0x801E8308 as three
# words at 0x800136E8. Each module is loaded whole there, so it shares
# GAME.EXE's address space and calls straight into GAME.EXE's text.
# `load_size` is the sector-granular entry span. Every module starts with a
# u32 id word (5, 6, ..., 0x20, one per module), 32 absolute handler pointers
# (0x04..0x83; `handler_offset`/`handler_count` below) and a u32 equal to the
# id plus 0x20 at 0x84, which GAME.EXE's table also points at (0x801E838C).
# Every handler pointer lands inside its own module; the lowest is a shared
# `jr ra; nop` default handler, and the slots that use it are the unused
# ones. In seven modules more bytes sit between 0x88 and that default
# handler: short code-pointer tables and functions no handler names. No two
# modules are byte-identical. Modules
# are named by archive entry index, not by area, because the area-to-entry
# relation is not yet proven.
[[archive]]
name = "FDAT.T"
disc_path = "CD/COM/FDAT.T"
sha256 = "2ece40fb09b5c7dc74b71387725ce5e97d5b0823752bd852f6709b1e932bc9c7"
file_size = 0x41B000
handler_offset = 0x4
handler_count = 32

[[overlay]]
name = "FDAT_002.BIN"
archive = "FDAT.T"
index = 2
host = "GAME.EXE"
sha256 = "1e41d31418e9b056310a2936510ee44ac13fbc286b2a715409bac6f419baf4a8"
load_address = 0x801E8308
load_size = 0x1000

